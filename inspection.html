<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KFC 外送機車每日檢查</title>
  <link rel="stylesheet" href="./inspection.css?v=final-rider-fix">
</head>
<body>
<main class="wrap">
<header><a class="home-link" href="./index.html">← 返回主選單</a><div class="brand">KFC BIKE MAINTENANCE</div><h1>開始上班</h1><p>外送機車每日安全檢查</p></header>
<form id="form">
<section class="card"><b>01・領車人</b><h2>領車人</h2><input id="inspector" required placeholder="請輸入姓名"></section>
<section class="card"><b>02・領車中心</b><h2>領車中心</h2><select id="center" required><option>載入中...</option></select></section>
<section class="card"><b>03・車輛</b><h2>搜尋車牌</h2><input id="search" disabled autocomplete="off" placeholder="輸入部分車牌，例如 5227"><div id="results"></div><div id="selected"></div><div id="bikeWarning"></div></section>
<section class="card"><b>04・行車紀錄器</b><h2>搜尋行車紀錄器</h2><input id="dashcamSearch" disabled autocomplete="off" placeholder="先選領車中心，再輸入紀錄器編號"><div id="dashcamResults"></div><div id="dashcamSelected"></div><button type="button" class="secondary" id="checkDashcam">檢查紀錄器狀態</button><div id="dashcamWarning"></div><label class="checkline"><input type="checkbox" id="dashcamAbnormal"> 本次發現行車紀錄器異常</label><textarea id="dashcamIssue" rows="3" placeholder="請輸入行車紀錄器異常內容" class="hidden"></textarea></section>
<section class="card"><b>05・目前公里數</b><h2>公里數</h2><input id="mileage" type="number" min="0" required placeholder="請輸入目前公里數"></section>
<section class="card"><b>06・輪胎</b><h2>輪胎檢查</h2>
<div class="check"><span>輪胎胎壓值 33 PSI</span><select id="tire_pressure_ok"><option value="true">正常</option><option value="false">異常</option></select></div>
<div class="check"><span>胎紋 0.8mm（不含）以下</span><select id="tread"><option value="false">否</option><option value="true">是（異常）</option></select></div>
</section>
<section class="card"><b>07・機車功能</b><h2>安全功能檢查</h2><div id="checks"></div><textarea id="otherIssue" rows="3" placeholder="請輸入其他異常內容，例如：後照鏡鬆動" class="hidden"></textarea></section>
<section class="card"><b>08・加油卡</b><h2>加油卡確認</h2>
<div class="fuel-card-options">
<button type="button" class="fuel-option" data-value="received">已領加油卡</button>
<button type="button" class="fuel-option" data-value="not_received">未領加油卡</button>
<button type="button" class="fuel-option" data-value="lost">加油卡遺失</button>
<button type="button" class="fuel-option" data-value="electric_na">電車無加油卡</button>
</div><input type="hidden" id="fuelCardStatus">
</section>
<section class="card"><b>09・異常 / 備註</b><h2>備註</h2><textarea id="note" rows="4" placeholder="其他補充說明"></textarea></section>
<div class="action-row"><a class="secondary home-button" href="./index.html">返回主選單</a><button id="submit" class="submit">確認並送出</button></div><div id="msg"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js?v=10"></script>
<script src="./inspection.js?v=12"></script>
</body></html>
