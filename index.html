<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC Bike Maintenance</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><b>KFC <span>Bike Maintenance</span></b><button onclick="toggleNav()">☰</button></header><aside id="nav"><a href="#dashboard">Dashboard</a><a href="#inspection">每日檢查</a><a href="#bikes">車輛管理</a><a href="#maintenance">維修管理</a></aside><main>
<section id="dashboard"><h1>Dashboard</h1><p class="sub">機車維護與每日檢查總覽</p><div class="cards"><div class="card">車輛總數<strong id="sBikes">0</strong></div><div class="card">今日檢查<strong id="sChecks">0</strong></div><div class="card">異常車輛<strong id="sIssues">0</strong></div><div class="card">待維修<strong id="sRepair">0</strong></div></div><div class="panel"><div class="ph"><h2>近期檢查紀錄</h2><button onclick="location.hash='inspection'">新增檢查</button></div><div class="scroll"><table><thead><tr><th>餐廳</th><th>車牌</th><th>檢查者</th><th>時間</th><th>狀態</th></tr></thead><tbody id="recent"></tbody></table></div></div></section>
<section id="inspection" class="hide"><h1>每日車輛檢查</h1><p class="sub">完成檢查後送出紀錄</p><form id="checkForm" class="panel grid"><label>Group / 餐廳<select id="restaurant" required></select></label><label>機車車牌<select id="plate" required></select></label><label>檢查者姓名<input id="inspector" required></label><label>行車紀錄器標號<input id="dashcam"></label><label>前輪胎壓 PSI<input id="frontPsi" type="number" value="33"></label><label>後輪胎壓 PSI<input id="rearPsi" type="number" value="33"></label><label>目前公里數<input id="mileage" type="number" min="0"></label><label>汽油存量 / 電量<input id="energy" placeholder="例如 80%"></label><div class="full checks"><h3>機車功能檢查</h3><label><input type="checkbox" id="engine" checked> 引擎發動</label><label><input type="checkbox" id="frontBrake" checked> 前煞系統</label><label><input type="checkbox" id="rearBrake" checked> 後煞系統</label><label><input type="checkbox" id="light" checked> 車頭大燈</label><label><input type="checkbox" id="tire" checked> 胎紋正常</label><label><input type="checkbox" id="camera" checked> 行車紀錄器</label></div><label class="full">異常 / 備註<textarea id="note" rows="3"></textarea></label><div class="full"><button type="submit">送出檢查紀錄</button></div></form></section>
<section id="bikes" class="hide"><div class="title"><div><h1>車輛管理</h1><p class="sub">管理餐廳與機車資料</p></div><button onclick="bikeDialog.showModal()">＋ 新增車輛</button></div><div class="panel scroll"><table><thead><tr><th>餐廳</th><th>車牌</th><th>車型</th><th>狀態</th><th></th></tr></thead><tbody id="bikeRows"></tbody></table></div></section>
<section id="maintenance" class="hide"><div class="title"><div><h1>維修管理</h1><p class="sub">追蹤異常與維修紀錄</p></div><button onclick="repairDialog.showModal();fillRepairPlates()">＋ 新增維修</button></div><div class="panel scroll"><table><thead><tr><th>日期</th><th>車牌</th><th>問題</th><th>狀態</th><th>備註</th></tr></thead><tbody id="repairRows"></tbody></table></div></section></main>
<dialog id="bikeDialog"><form method="dialog" id="bikeForm"><h2>新增車輛</h2><label>餐廳<input id="newRestaurant" required></label><label>車牌<input id="newPlate" required></label><label>車型<input id="newModel"></label><div class="actions"><button value="cancel" class="light">取消</button><button value="default" onclick="addBike(event)">儲存</button></div></form></dialog>
<dialog id="repairDialog"><form method="dialog" id="repairForm"><h2>新增維修</h2><label>日期<input id="repairDate" type="date"></label><label>車牌<select id="repairPlate"></select></label><label>問題<input id="repairIssue" required></label><label>狀態<select id="repairStatus"><option>待維修</option><option>維修中</option><option>已完成</option></select></label><label>備註<input id="repairNote"></label><div class="actions"><button value="cancel" class="light">取消</button><button value="default" onclick="addRepair(event)">儲存</button></div></form></dialog><script src="assets/app.js"></script></body></html>
