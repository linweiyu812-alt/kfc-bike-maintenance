<section class="kpis"><div class="kpi"><b id="total">-</b><span>餐廳總數</span></div><div class="kpi"><b id="active">-</b><span>啟用中</span></div><div class="kpi"><b id="inactive">-</b><span>已停用</span></div></section>
<section class="panel" id="editPanel"><div class="section-title"><h2>新增／更新餐廳</h2></div><div class="filters">

<div class="tablewrap"><table><thead><tr><th>中心</th><th>店號</th><th>餐廳名稱</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="msg" class="msg"></div></main>
