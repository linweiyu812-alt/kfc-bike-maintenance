<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行車紀錄器管理</title><link rel="stylesheet" href="./admin.css?v=13.3"></head><body><main class="shell">
<div class="top"><div><div class="brand">KFC BIKE MAINTENANCE</div><h1>行車紀錄器管理</h1><p class="muted" id="who"></p></div>
<nav class="nav"><a href="./admin.html">管理首頁</a><a href="./bike-management.html">機車管理</a><a href="./dashcam-management.html">行車紀錄器管理</a><a href="./restaurant-management.html">餐廳主檔</a><a href="./battery-inventory.html">電池/充電器管理</a><a href="./maintenance.html">機車維修追蹤</a><a href="./dashcam-maintenance.html">行車紀錄器異常</a><a href="./account.html">帳號設定</a><a href="#" id="logout">登出</a></nav></div>
<section class="kpis"><div class="kpi"><b id="total">-</b><span>紀錄器總數</span></div><div class="kpi"><b id="normal">-</b><span>正常</span></div><div class="kpi danger"><b id="abnormal">-</b><span>異常處理中</span></div></section>
<section class="panel"><div class="section-title"><h2>新增／更新行車紀錄器</h2></div><div class="filters">
<label>外送中心<select id="center"></select></label><label>紀錄器編號<input id="number" class="inputwide" placeholder="輸入行車紀錄器編號"></label>
<label>放置餐廳<input id="restaurantSearch" class="inputwide" autocomplete="off" placeholder="輸入餐廳關鍵字"><div id="restaurantResults"></div><small id="restaurantSelected"></small></label>
<button class="btn" id="save">新增紀錄器</button><button class="btn light" id="cancel" style="display:none">取消編輯</button></div></section>
<section class="panel"><div class="filter-panel"><div class="filters">
<label>外送中心<select id="filterCenter"><option value="">全部中心</option></select></label>
<label>放置餐廳<input id="filterRestaurant" placeholder="輸入餐廳名稱或店號"></label>
<label>狀態<select id="filterStatus"><option value="">全部狀態</option><option value="normal">正常</option><option value="abnormal">異常處理中</option></select></label>
<label>紀錄器編號<input id="q" placeholder="輸入紀錄器編號"></label>
<button class="btn light" id="clearFilters">清除篩選</button><button class="btn light" id="refresh">更新資料</button>
</div><div class="filter-count" id="filterCount"></div></div>
<div class="tablewrap"><table><thead><tr><th>中心</th><th>紀錄器編號</th><th>放置餐廳</th><th>最近使用餐廳</th><th>最近領取人</th><th>最後紀錄</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=final"></script><script src="./dashcam-management.js?v=13.3"></script></body></html>
