<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>機車管理</title><link rel="stylesheet" href="./admin.css?v=11"></head><body><main class="shell">
<div class="top"><div><div class="brand">KFC BIKE MAINTENANCE</div><h1>機車管理</h1><p class="muted" id="who"></p></div>
<nav class="nav"><a href="./admin.html">管理首頁</a><a href="./bike-management.html">機車管理</a><a href="./dashcam-management.html">行車紀錄器管理</a><a href="./battery-management.html">電池/充電器</a><a href="./restaurant-management.html">餐廳主檔</a><a href="./maintenance.html">機車維修追蹤</a><a href="./dashcam-maintenance.html">行車紀錄器異常</a><a href="./account.html">帳號設定</a><a href="#" id="logout">登出</a></nav></div>
<section class="kpis"><div class="kpi"><b id="total">-</b><span>機車總數</span></div><div class="kpi"><b id="oil">-</b><span>油車</span></div><div class="kpi"><b id="electric">-</b><span>電動車</span></div></section>
<section class="panel"><div class="section-title"><h2>新增／更新機車</h2></div><div class="filters">
<label>外送中心<select id="center"></select></label><label>車牌<input id="plate" class="inputwide" placeholder="例如 ABC-1234"></label>
<label>車種<select id="type"><option value="油車">油車</option><option value="電車">電車</option></select></label>
<label>放置餐廳<input id="restaurantSearch" class="inputwide" autocomplete="off" placeholder="輸入餐廳關鍵字"><div id="restaurantResults"></div><small id="restaurantSelected"></small></label>
<label>取得日期<input id="acquired" type="date"></label><button class="btn" id="save">新增機車</button><button class="btn light" id="cancel" style="display:none">取消編輯</button></div></section>
<section class="panel"><div class="filters"><label>搜尋<input id="q" placeholder="輸入車牌關鍵字"></label><button class="btn light" id="refresh">更新資料</button></div>
<div class="tablewrap"><table><thead><tr><th>中心</th><th>車牌</th><th>車種</th><th>放置餐廳</th><th>取得日期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=11"></script><script src="./bike-management.js?v=11"></script></body></html>
