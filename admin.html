<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC 機車管理後台</title><link rel="stylesheet" href="./admin.css?v=11"></head><body><main class="shell"><div class="top"><div><div class="brand">KFC BIKE MAINTENANCE</div><h1>外送中心機車管理後台</h1><p class="muted" id="who"></p></div><nav class="nav"><a href="./admin.html">管理首頁</a><a href="./bike-management.html">機車管理</a><a href="./dashcam-management.html">行車紀錄器管理</a><a href="./restaurant-management.html">餐廳主檔</a><a href="./maintenance.html">機車維修追蹤</a><a href="./dashcam-maintenance.html">行車紀錄器異常</a><a href="./account.html">帳號設定</a><a href="#" id="logout">登出</a></nav></div><section class="panel filters"><label>外送中心<select id="center"></select></label><label>日期<input type="date" id="date"></label><label>檢查狀態<select id="filter"><option value="all">全部</option><option value="completed">已完成檢查</option><option value="incomplete">未完成檢查</option><option value="abnormal">檢查異常</option></select></label><button class="btn" id="refresh">更新資料</button><button class="btn light" id="export">匯出檢查明細 Excel</button></section><section class="kpis"><div class="kpi"><b id="total">-</b><span>管理車輛</span></div><div class="kpi"><b id="checked">-</b><span>今日已檢查</span></div><div class="kpi"><b id="unchecked">-</b><span>今日未檢查</span></div><div class="kpi danger"><b id="abnormal">-</b><span>今日異常</span></div><div class="kpi danger"><b id="openmaint">-</b><span>未完成維修</span></div></section><section id="opData" class="panel danger-zone admin-only">
<div class="section-title"><h2>歷史資料管理（僅 OP）</h2><span id="oldCount">計算中...</span></div>
<p class="muted">清除前請先匯出備份。系統只刪除 3 個月前的檢查明細；車輛主檔、帳號、中心與維修追蹤不刪除，且會保留每台車最後檢查日期。</p>
<div class="account-grid">
<div class="account-card"><h3>檢查紀錄</h3><p class="muted" id="oldCount">計算中...</p><div class="filters"><button class="btn light" id="exportOld">匯出 3 個月前</button><button class="btn danger-btn" id="deleteOld">清除 3 個月前</button></div></div>
<div class="account-card"><h3>已完成機車維修</h3><p class="muted" id="oldMaintCount">計算中...</p><div class="filters"><button class="btn light" id="exportOldMaint">匯出 3 個月前已完成</button><button class="btn danger-btn" id="deleteOldMaint">清除 3 個月前已完成</button></div></div>
<div class="account-card"><h3>已完成行車紀錄器異常</h3><p class="muted" id="oldDashCount">計算中...</p><div class="filters"><button class="btn light" id="exportOldDash">匯出 3 個月前已完成</button><button class="btn danger-btn" id="deleteOldDash">清除 3 個月前已完成</button></div></div>
</div>
</section>
<section class="panel"><div class="section-title"><h2>車輛檢查狀態</h2><span id="completion"></span></div><div class="tablewrap"><table><thead><tr><th>中心</th><th>車牌</th><th>車種</th><th>今日狀態</th><th>今日檢查時間</th><th>上次檢查日期</th><th>領車人</th><th>公里數</th><th>維修</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="./supabase-config.js?v=9"></script><script src="./admin.js?v=9"></script></body></html>
