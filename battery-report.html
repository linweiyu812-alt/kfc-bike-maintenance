<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電池故障回報</title><link rel="stylesheet" href="./inspection.css?v=final"></head><body><main class="wrap"><div class="brand">KFC DELIVERY</div><h1>電池故障回報</h1><p><a href="./index.html">← 返回功能入口</a></p>
<form id="form"><section class="card"><b>01・放置餐廳</b><h2>選擇外送中心與餐廳</h2><select id="center" required></select><input id="restaurantSearch" autocomplete="off" placeholder="輸入餐廳名稱或店號" required><div id="restaurantResults"></div><div id="restaurantSelected"></div></section>
<section class="card"><b>02・電池</b><h2>掃描 QR Code 或輸入編號</h2><div class="row"><input id="batteryCode" placeholder="電池 QR Code / 編號" required><button type="button" class="secondary" id="scan">掃描 QR</button></div><video id="video" playsinline style="display:none;width:100%;border-radius:14px;margin-top:10px"></video><small id="scanHelp"></small></section>
<section class="card"><b>03・故障內容</b><input id="reporter" placeholder="回報人姓名" required><textarea id="issue" rows="4" placeholder="請描述電池故障狀況" required></textarea></section><button id="submit" type="submit">送出故障回報</button><div id="msg" class="msg"></div></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=final"></script><script src="./battery-report.js?v=final"></script></body></html>
