<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KFC 外送機車每日檢查</title><link rel="stylesheet" href="inspection.css"></head>
<body><main class="wrap">
<header><div class="brand">KFC BIKE MAINTENANCE</div><h1>開始上班</h1><p>外送機車每日安全檢查</p></header>
<form id="form">
<section class="card"><b>01・領車人</b><h2>領車人</h2><input id="inspector" required placeholder="請輸入姓名"></section>
<section class="card"><b>02・領車中心</b><h2>領車中心</h2><select id="center" required><option>載入中...</option></select></section>
<section class="card"><b>03・車輛</b><h2>搜尋車牌</h2><input id="search" disabled autocomplete="off" placeholder="輸入部分車牌，例如 5227"><div id="results"></div><div id="selected"></div><div id="bikeWarning"></div></section>

<section class="card"><b>04・行車紀錄器</b><h2>行車紀錄器號碼</h2>
<input id="dashcam" placeholder="請輸入紀錄器號碼">
<button type="button" class="secondary" id="checkDashcam">檢查紀錄器狀態</button>
<div id="dashcamWarning"></div>
<label class="checkline"><input type="checkbox" id="dashcamAbnormal"> 本次發現行車紀錄器異常</label>
<textarea id="dashcamIssue" rows="3" placeholder="請輸入行車紀錄器異常內容" class="hidden"></textarea>
</section>

<section class="card"><b>05・目前公里數</b><h2>公里數</h2><input id="mileage" type="number" min="0" required placeholder="請輸入目前公里數"></section>
<section class="card"><b>06・輪胎</b><h2>胎壓與胎紋</h2><div class="two"><label>前輪 PSI<input id="front" type="number" value="33" step=".1"></label><label>後輪 PSI<input id="rear" type="number" value="33" step=".1"></label></div><label>胎紋低於 0.8mm<select id="tread"><option value="false">否</option><option value="true">是（異常）</option></select></label></section>
<section class="card"><b>07・機車功能</b><h2>安全功能檢查</h2><div id="checks"></div></section>
<section class="card"><b>08・外送設備</b><h2>設備數量</h2><div class="two"><label>杯架<input id="cups" type="number" value="0" min="0"></label><label>外送袋<input id="bags" type="number" value="0" min="0"></label></div></section>
<section class="card"><b>09・汽油 / 電量</b><h2 id="energyTitle">汽油 / 電量 %</h2><input id="energy" type="number" min="0" max="100" placeholder="例如 80"></section>
<section class="card"><b>10・異常 / 備註</b><h2>備註</h2><textarea id="note" rows="4" placeholder="其他補充說明"></textarea></section>
<button id="submit" class="submit">確認並送出</button><div id="msg"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="inspection.js"></script></body></html>
