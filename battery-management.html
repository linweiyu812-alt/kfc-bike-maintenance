<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電池與充電器管理</title><link rel="stylesheet" href="./admin.css?v=13"></head><body><main class="shell"><div class="top"><div><div class="brand">KFC EQUIPMENT</div><h1>電池與充電器管理</h1><p class="muted" id="who"></p></div><nav class="nav"><a href="./admin.html">管理首頁</a><a href="./bike-management.html">機車管理</a><a href="./dashcam-management.html">行車紀錄器管理</a><a href="./battery-management.html">電池/充電器</a><a href="./restaurant-management.html">餐廳主檔</a><a href="#" id="logout">登出</a></nav></div><section class="kpis"><div class="kpi"><b id="batteryTotal">-</b><span>電池總數</span></div><div class="kpi"><b id="chargerTotal">-</b><span>充電器總數</span></div><div class="kpi danger"><b id="openIssues">-</b><span>待處理電池故障</span></div></section><section class="panel"><h2>庫存異動</h2><div class="filters"><label>動作<select id="action"><option value="purchase">新購</option><option value="scrap">報廢</option><option value="transfer">餐廳調撥</option><option value="adjust">盤點調整</option></select></label><label>設備<select id="equipment"><option value="battery">電池</option><option value="charger">充電器</option></select></label><label>餐廳<input id="fromSearch" placeholder="搜尋餐廳"><div id="fromResults"></div><small id="fromSelected"></small></label><label id="toWrap" style="display:none">調入餐廳<input id="toSearch" placeholder="搜尋餐廳"><div id="toResults"></div><small id="toSelected"></small></label><label>數量<input id="qty" type="number" min="0" value="1"></label><button class="btn" id="saveMove">確認異動</button></div><p class="muted">盤點調整請輸入盤點後的「實際總數」；其他動作輸入異動數量。</p></section><section class="panel"><h2>各餐廳目前庫存</h2><input id="q" placeholder="搜尋餐廳"><div class="table-wrap"><table><thead><tr><th>中心</th><th>餐廳</th><th>電池</th><th>充電器</th><th>最後更新</th></tr></thead><tbody id="stockRows"></tbody></table></div></section><section class="panel"><h2>電池故障紀錄</h2><div class="table-wrap"><table><thead><tr><th>時間</th>
