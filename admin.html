<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC 機車管理後台</title><link rel="stylesheet" href="./admin.css?v=4"></head><body><main class="shell">
<div class="top"><div><div class="brand">KFC BIKE MAINTENANCE</div><h1>外送中心機車管理後台</h1></div><nav class="nav"><a href="./inspection.html">每日檢查</a><a href="./maintenance.html">維修追蹤</a></nav></div>
<section class="panel filters"><label>外送中心<select id="center"><option value="">全部中心</option></select></label><label>日期<input type="date" id="date"></label><button class="btn" id="refresh">更新資料</button><button class="btn light" id="export">匯出檢查明細 Excel</button></section>
<section class="kpis"><div class="kpi"><b id="total">-</b><span>管理車輛</span></div><div class="kpi"><b id="checked">-</b><span>今日已檢查</span></div><div class="kpi"><b id="unchecked">-</b><span>今日未檢查</span></div><div class="kpi danger"><b id="abnormal">-</b><span>今日異常車輛</span></div><div class="kpi danger"><b id="openmaint">-</b><span>未完成維修</span></div></section>
<section class="panel"><div class="section-title"><h2>車輛檢查狀態</h2><span id="completion" class="muted"></span></div><div class="tablewrap"><table><thead><tr><th>中心</th><th>車牌</th><th>車種</th><th>檢查狀態</th><th>檢查時間</th><th>領車人</th><th>公里數</th><th>異常</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="./supabase-config.js?v=4"></script><script src="./admin.js?v=4"></script></body></html>
