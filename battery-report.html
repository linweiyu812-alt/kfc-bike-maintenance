<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電池故障回報</title><link rel="stylesheet" href="./admin.css?v=16"><style>
.battery-form{display:grid;gap:20px;max-width:720px}
.battery-form label{display:grid;gap:8px;font-weight:700;font-size:16px}
.battery-form select,.battery-form input,.battery-form textarea{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d7d0c5;border-radius:10px;background:#fff;font:inherit}
.battery-form select:focus,.battery-form input:focus,.battery-form textarea:focus{outline:2px solid #e31b23;outline-offset:1px}
.battery-code-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.battery-prefix{min-width:90px;padding:12px 14px;border-radius:10px;background:#f3efe7;font-size:20px}
.battery-preview{padding:14px 16px;border-radius:10px;background:#f7f4ee;font-weight:700}
.battery-form .btn{justify-self:start}
#restaurantResults{position:relative;display:grid;gap:6px;margin-top:4px;max-height:280px;overflow:auto}
#restaurantResults .result{border-radius:10px;width:100%;text-align:left;font:inherit}
#restaurantResults .result:hover,#restaurantResults .result:active{background:#f7f4ee}
#restaurantSelected{display:block;margin-top:6px;font-weight:700;color:#2f6b3b}
#restaurantResults .result{padding:10px 12px;border:1px solid #e4ded4;background:#fff;cursor:pointer}
#restaurantResults .result small{display:block;color:#777}
@media(max-width:640px){.wrap.narrow{padding:16px}.topbar{align-items:flex-start}.battery-code-row{grid-template-columns:105px 1fr}.battery-form .btn{width:100%}}
</style></head>
<body><main class="wrap narrow"><div class="topbar"><div><h1>電池故障回報</h1><p class="muted">選擇外送中心後，只需輸入電池後續編號。</p></div><a class="btn light" href="./index.html">返回主選單</a></div>
<section class="panel"><form id="form" class="battery-form">
<label>1. 外送中心<select id="center" required><option value="">請選擇</option><option value="TP01" data-prefix="I997-">台北外送中心</option><option value="NT01" data-prefix="I994-">新北外送中心</option><option value="TY01" data-prefix="I995-">桃園外送中心</option><option value="TC01" data-prefix="I996-">台中外送中心</option><option value="TN01" data-prefix="I998-">台南外送中心</option><option value="KH01" data-prefix="I981-">高雄外送中心</option></select></label>
<label>2. 電池編號<div class="battery-code-row"><b id="prefix" class="battery-prefix">請先選中心</b><input id="suffix" inputmode="numeric" pattern="[0-9]*" placeholder="例如 3" disabled required></div><small class="muted">輸入 3 會自動轉成 003。</small></label>
<div class="battery-preview" id="batteryPreview">本次回報電池：-</div>
<label>3. 放置餐廳<input id="restaurantSearch" placeholder="輸入關鍵字，例如：後昌、建國、店號" disabled autocomplete="off" required><small class="muted">輸入關鍵字後，下方會即時顯示該外送中心的餐廳，點一下即可選取。</small><div id="restaurantResults"></div><small id="restaurantSelected"></small></label>
<label>4. 異常說明<textarea id="issue" rows="3" placeholder="例如：無法充電、續航異常、外觀破損" required></textarea></label>
<label>5. 回報人<input id="reportedBy" placeholder="姓名" required></label>
<button class="btn" type="submit">送出故障回報</button><p id="msg"></p>
</form></section></main>
<script>
(function(){
  const map={TP01:"I997-",NT01:"I994-",TY01:"I995-",TC01:"I996-",TN01:"I998-",KH01:"I981-"};
  function sync(){
    const c=document.getElementById("center"), pre=document.getElementById("prefix"),
          suf=document.getElementById("suffix"), rs=document.getElementById("restaurantSearch"),
          pv=document.getElementById("batteryPreview");
    if(!c||!pre)return;
    const prefix=(c.options[c.selectedIndex]&&c.options[c.selectedIndex].dataset.prefix)||map[c.value]||"";
    pre.textContent=prefix||"請先選中心";
    if(suf)suf.disabled=!prefix;
    if(rs)rs.disabled=!prefix;
    const n=suf?suf.value.replace(/\D/g,""):"";
    if(pv)pv.textContent="本次回報電池："+(prefix&&n?prefix+n.padStart(3,"0"):"-");
  }
  window.syncBatteryCenter=sync;
  document.addEventListener("change",e=>{if(e.target&&e.target.id==="center")sync()});
  document.addEventListener("input",e=>{if(e.target&&e.target.id==="suffix"){e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);sync()}});
  document.addEventListener("DOMContentLoaded",sync);
  window.addEventListener("pageshow",sync);
  setTimeout(sync,0);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=168"></script><script>
(function(){
 const $=id=>document.getElementById(id); let restaurant=null,timer=null,sb=null;
 function client(){if(sb)return sb;if(!window.supabase||!window.KFC_CONFIG)return null;return sb=window.supabase.createClient(KFC_CONFIG.SUPABASE_URL,KFC_CONFIG.SUPABASE_KEY)}
 function code(){const m={TP01:"I997-",NT01:"I994-",TY01:"I995-",TC01:"I996-",TN01:"I998-",KH01:"I981-"},s=$("suffix").value.replace(/\D/g,""),c=$("center").value;return c&&s?(m[c]||"")+s.padStart(3,"0"):""}
 function clearR(){restaurant=null;$("restaurantSelected").textContent="";$("restaurantResults").innerHTML=""}
 $("center").addEventListener("change",()=>{$("restaurantSearch").value="";clearR()});
 $("restaurantSearch").addEventListener("input",()=>{clearTimeout(timer);clearR();const q=$("restaurantSearch").value.trim();if(!q)return;$("restaurantResults").innerHTML='<div class="result">搜尋中…</div>';timer=setTimeout(search,150)});
 async function search(){
  const q=$("restaurantSearch").value.trim(),c=$("center").value;if(!q||!c)return;
  const api=client();if(!api){$("restaurantResults").innerHTML='<div class="result">搜尋功能載入失敗，請重新整理頁面。</div>';return}
  try{
   const {data,error}=await api.rpc("public_restaurant_search",{p_center_code:c,p_keyword:q});
   if(error){$("restaurantResults").innerHTML='<div class="result">搜尋失敗：'+error.message+'</div>';return}
   const rows=(data||[]).slice(0,10);
   if(!rows.length){$("restaurantResults").innerHTML='<div class="result">找不到符合的餐廳</div>';return}
   $("restaurantResults").innerHTML=rows.map((r,i)=>'<button type="button" class="result restaurant-choice" data-index="'+i+'"><b>'+(r.name||"")+'</b>'+(r.store_no?'<small>店號：'+r.store_no+'</small>':'')+'</button>').join("");
   document.querySelectorAll(".restaurant-choice").forEach(b=>b.onclick=()=>{restaurant=rows[+b.dataset.index];$("restaurantSearch").value=restaurant.name||"";$("restaurantResults").innerHTML="";$("restaurantSelected").textContent="✓ 已選擇："+(restaurant.name||"")+(restaurant.store_no?"｜"+restaurant.store_no:"")});
  }catch(e){$("restaurantResults").innerHTML='<div class="result">搜尋失敗：'+(e?.message||e)+'</div>'}
 }
 $("form").addEventListener("submit",async e=>{
  e.preventDefault();const bc=code();if(!bc)return alert("請輸入電池編號");if(!restaurant)return alert("請先從搜尋結果選擇放置餐廳");
  const issue=$("issue").value.trim(),who=$("reportedBy").value.trim();if(!issue||!who)return;const api=client();if(!api)return alert("系統載入失敗，請重新整理頁面");
  const {error}=await api.rpc("report_battery_fault",{p_restaurant_id:restaurant.id,p_battery_code:bc,p_reported_by:who,p_issue_description:issue});
  if(error){$("msg").textContent="送出失敗："+error.message;return}$("msg").textContent="✓ 已送出 "+bc+" 故障回報";
  $("suffix").value="";$("issue").value="";$("reportedBy").value="";$("restaurantSearch").value="";clearR();if(window.syncBatteryCenter)window.syncBatteryCenter();
 });
})();
</script></body></html>
