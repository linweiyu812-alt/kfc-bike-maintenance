<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電池/充電器管理</title><link rel="stylesheet" href="./admin.css?v=13.1"></head><body><main class="shell"><div class="top"><div><div class="brand">KFC BIKE MAINTENANCE</div><h1>電池 / 充電器管理</h1><p class="muted" id="who"></p></div><nav class="nav"><a href="./admin.html">管理首頁</a><a href="./bike-management.html">機車管理</a><a href="./dashcam-management.html">行車紀錄器管理</a><a href="./restaurant-management.html">餐廳主檔</a><a href="./battery-inventory.html">電池/充電器管理</a><a href="./maintenance.html">機車維修追蹤</a><a href="./dashcam-maintenance.html">行車紀錄器異常</a><a href="./account.html">帳號設定</a><a href="#" id="logout">登出</a></nav></div>
<section class="kpis"><div class="kpi"><b id="batteryTotal">-</b><span>電池庫存</span></div><div class="kpi"><b id="chargerTotal">-</b><span>充電器庫存</span></div><div class="kpi danger"><b id="faultTotal">-</b><span>未完成故障</span></div></section>
<section class="panel" id="importPanel"><div class="section-title"><h2>Excel 盤點匯入</h2></div><p class="muted">Excel / CSV 欄位：餐廳店號（或餐廳名稱）、電池數量、充電器數量。匯入會更新該餐廳目前盤點數量並留下盤點紀錄。</p><div class="import-box"><label><b>選擇 Excel / CSV 檔案</b><input type="file" id="inventoryFile" accept=".xlsx,.xls,.csv"></label><button class="btn" id="importBtn">開始匯入盤點</button></div><span id="importMsg"></span></section>
<section class="panel op-only" id="adjustPanel"><div class="section-title"><h2>新購 / 報廢調整</h2></div><div class="filters"><label>外送中心<select id="center"></select></label><label>餐廳<input id="restaurantSearch" placeholder="輸入餐廳關鍵字"><div id="restaurantResults"></div><small id="restaurantSelected"></small></label><label>資產<select id="assetType"><option value="battery">電池</option><option value="charger">充電器</option></select></label><label>動作<select id="action"><option value="purchase">新購增加</option><option value="scrap">報廢扣除</option></select></label><label>數量<input id="qty" type="number" min="1" value="1"></label><label>備註<input id="note"></label><button class="btn" id="adjustBtn">確認調整</button></div></section>
<section class="panel"><div class="section-title"><h2>目前庫存</h2></div><div class="filters"><label>搜尋<input id="q" placeholder="餐廳名稱 / 店號 / 中心"></label><button class="btn light" id="refresh">更新</button></div><div class="tablewrap"><table><thead><tr><th>中心</th><th>店號</th><th>餐廳</th><th>電池</th><th>充電器</th><th>最後更新</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel"><div class="section-title"><h2>電池故障回報</h2></div><div class="tablewrap"><table><thead><tr><th>中心</th><th>餐廳</th><th>電池編號</th><th>故障內容</th><th>回報人</th><th>時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="faultRows"></tbody></table></div></section>
<section class="panel op-only"><div class="section-title"><h2>一年紀錄清理</h2></div><p class="muted">只清除超過 1 年的庫存異動與已完成故障紀錄，不影響目前庫存。</p><button class="btn danger-btn" id="cleanup">清除超過 1 年紀錄</button></section><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="./supabase-config.js?v=final"></script><script src="./battery-inventory.js?v=13.1"></script></body></html>
