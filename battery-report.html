<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電池故障回報</title><link rel="stylesheet" href="./inspection.css?v=13"><style>#video{width:100%;max-height:330px;border-radius:14px;background:#111;display:none}.rowbtn{display:flex;gap:10px;flex-wrap:wrap}.secondary{margin-top:8px}</style></head><body><main class="wrap"><header><div class="brand">KFC BATTERY REPORT</div><h1>電池故障回報</h1><p>只有發生故障時才需要回報</p></header><form id="form"><section class="card"><b>01・電池</b><h2>電池 QR Code</h2><input id="batteryCode" required placeholder="掃描 QR Code 或手動輸入電池編號"><div class="rowbtn"><button type="button" class="secondary" id="scan">📷 掃描 QR Code</button><button type="button" class="secondary" id="stop" style="display:none">停止掃描</button></div><video id="video" playsinline></video><div id="scanMsg"></div></section><section class="card"><b>02・餐廳</b><h2>故障當下放置餐廳</h2><input id="restaurantSearch" autocomplete="off" placeholder="輸入餐廳名稱或店號"><div id="restaurantResults"></div><div id="restaurantSelected"></div></section><section class="card"><b>03・故障狀況</b><h2>選擇故障原因</h2><select id="issue" required><option value="">請選擇</option><option>騎乘途中斷電</option><option>無法充電</option><option>續航異常</option><option>外觀損壞</option><option>其他</option></select><textarea id="note" rows="3" placeholder="備註（選填）"></textarea></section><button id="submit" class="submit">送出故障回報</button><div id="msg"></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=13"></script><script src="./battery-report.js?v=13"></script></body></html>
