<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC 維修追蹤</title><link rel="stylesheet" href="./admin.css?v=4"></head><body><main class="shell">
<div class="top"><div><div class="brand">KFC BIKE MAINTENANCE</div><h1>維修追蹤</h1><p class="muted">只有狀態更新為「已完成」，每日檢查選到該車時才不會再跳出未完成維修提醒。</p></div><nav class="nav"><a href="./admin.html">回管理後台</a><a href="./inspection.html">每日檢查</a></nav></div>
<section class="panel filters"><label>外送中心<select id="center"><option value="">全部中心</option></select></label><label>狀態<select id="status"><option value="open">未完成</option><option value="pending">待維修</option><option value="repairing">維修中</option><option value="completed">已完成</option><option value="all">全部</option></select></label><label>完成確認人<input id="operator" placeholder="請輸入姓名"></label><button class="btn" id="refresh">更新資料</button></section>
<section class="panel"><div class="tablewrap"><table><thead><tr><th>中心</th><th>車牌</th><th>異常項目</th><th>回報時間</th><th>狀態</th><th>完成時間</th><th>完成確認人</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="msg" class="msg"></div></main>
