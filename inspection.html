<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC 車輛檢查</title><link rel="stylesheet" href="inspection.css"></head><body><main><header><b>KFC BIKE MAINTENANCE</b><h1>開始上班</h1></header><form id="form">
<section><b>01・領車人</b><h2>領車人</h2><input id="inspector" required placeholder="請輸入姓名"></section>
<section><b>02・領車中心</b><h2>領車中心</h2><select id="center" required><option>載入中...</option></select></section>
<section><b>03・車輛</b><h2>搜尋車牌</h2><input id="search" disabled placeholder="輸入部分車牌，例如 5227"><div id="results"></div><div id="selected"></div></section>
<section><b>04・行車紀錄器</b><h2>行車紀錄器號碼</h2><input id="dashcam" placeholder="請輸入紀錄器號碼"></section>
<section><b>05・目前公里數</b><h2>公里數</h2><input id="mileage" type="number" min="0" required placeholder="請輸入目前公里數"></section>
<section><b>06・輪胎</b><h2>胎壓與胎紋</h2><div class="two"><label>前輪 PSI<input id="front" type="number" value="33" step=".1"></label><label>後輪 PSI<input id="rear" type="number" value="33" step=".1"></label></div><label>胎紋低於 0.8mm<select id="tread"><option value="false">否</option><option value="true">是（異常）</option></select></label></section>
<section><b>07・車輛功能</b><h2>安全功能檢查</h2><div id="checks"></div></section>
<section><b>08・外送設備</b><h2>設備數量</h2><div class="two"><label>杯架<input id="cups" type="number" value="0"></label><label>外送袋<input id="bags" type="number" value="0"></label></div></section>
<section><b>09・汽油 / 電量</b><h2 id="energyTitle">汽油 / 電量 %</h2><input id="energy" type="number" min="0" max="100" placeholder="例如 80"></section>
<section><b>10・異常 / 備註</b><h2>備註</h2><textarea id="note" rows="4"></textarea></section>
<button id="submit">確認並送出</button><div id="msg"></div></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="inspection.js"></script></body></html>
